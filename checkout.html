```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout Page</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #222;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #222;
        }

        h2 {
            margin: 25px 0 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #eee;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #2563eb;
        }

        textarea {
            resize: vertical;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .row .form-group {
            flex: 1;
        }

        .payment-options {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .payment-option {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
        }

        .payment-option input {
            width: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f1f3f5;
        }

        .total {
            font-weight: bold;
            font-size: 18px;
        }

        .order-button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 7px;
            background-color: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .order-button:hover {
            background-color: #1d4ed8;
        }

        @media (max-width: 600px) {

            body {
                padding: 20px 10px;
            }

            .container {
                padding: 20px;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }

            .payment-options {
                flex-direction: column;
                gap: 10px;
            }

            table {
                font-size: 14px;
            }

            th,
            td {
                padding: 10px;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Checkout</h1>

        <form>

            <!-- Customer Information -->
            <h2>Customer Information</h2>

            <div class="form-group">
                <label for="customer-name">Customer Name</label>
                <input
                    type="text"
                    id="customer-name"
                    name="customer-name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="row">

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter phone number"
                        required
                    >
                </div>

            </div>


            <!-- Shipping Address -->
            <h2>Shipping Address</h2>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea
                    id="address"
                    name="address"
                    rows="4"
                    placeholder="Enter your complete address"
                    required
                ></textarea>
            </div>

            <div class="row">

                <div class="form-group">
                    <label for="city">City</label>
                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="Enter city"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="state">State</label>
                    <input
                        type="text"
                        id="state"
                        name="state"
                        placeholder="Enter state"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="postal-code">Postal Code</label>
                    <input
                        type="text"
                        id="postal-code"
                        name="postal-code"
                        placeholder="Postal code"
                        required
                    >
                </div>

            </div>


            <!-- Payment Method -->
            <h2>Payment Method</h2>

            <div class="payment-options">

                <label class="payment-option">
                    <input
                        type="radio"
                        name="payment-method"
                        value="credit-card"
                        required
                    >
                    Credit Card
                </label>

                <label class="payment-option">
                    <input
                        type="radio"
                        name="payment-method"
                        value="debit-card"
                    >
                    Debit Card
                </label>

                <label class="payment-option">
                    <input
                        type="radio"
                        name="payment-method"
                        value="upi"
                    >
                    UPI
                </label>

                <label class="payment-option">
                    <input
                        type="radio"
                        name="payment-method"
                        value="cash-on-delivery"
                    >
                    Cash on Delivery
                </label>

            </div>


            <!-- Order Summary -->
            <h2>Order Summary</h2>

            <table>

                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Price</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td>Product 1</td>
                        <td>1</td>
                        <td>₹999</td>
                    </tr>

                    <tr>
                        <td>Product 2</td>
                        <td>2</td>
                        <td>₹1,998</td>
                    </tr>

                    <tr class="total">
                        <td colspan="2">Total</td>
                        <td>₹2,997</td>
                    </tr>

                </tbody>

            </table>


            <!-- Place Order -->
            <button
                type="submit"
                class="order-button"
            >
                Place Order
            </button>

        </form>

    </div>

</body>

</html>
```
